name: Deploy NavCore website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Export static website
        run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /NavCore
          NEXT_PUBLIC_NAVCORE_API_URL: https://navcore-production-06ce08bd.up.railway.app

      - name: Add Pages marker
        run: touch frontend/out/.nojekyll

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
