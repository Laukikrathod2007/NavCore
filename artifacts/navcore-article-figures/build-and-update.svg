<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">NavCore setup, runtime, and live operations</title><desc id="desc">Three lanes show what happens during initial setup and ingestion, per-patient use, and operator updates. Initial model downloads may require internet; after assets are available the query path can run locally. Operator updates travel to connected clients by WebSocket.</desc>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#607462"/></marker><marker id="arrBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527b8a"/></marker></defs>
  <rect width="1440" height="760" fill="#f8f7f2"/><text x="60" y="60" fill="#193824" font-family="Georgia,serif" font-size="31" font-weight="700">Separate the setup work from the patient’s request</text><text x="60" y="94" fill="#627066" font-family="Arial,sans-serif" font-size="16">A deployment has three rhythms: prepare the site, guide each patient, keep staff changes in sync.</text>
  <g font-family="Arial,sans-serif"><rect x="50" y="130" width="1340" height="176" rx="18" fill="#fff" stroke="#d6d8ce" stroke-width="2"/><rect x="50" y="130" width="12" height="176" rx="6" fill="#9a6845"/><text x="88" y="170" fill="#815530" font-size="13" font-weight="700" letter-spacing="2">01 / SITE SETUP · WHEN THE MAP OR ALIASES CHANGE</text>
    <rect x="92" y="198" width="205" height="68" rx="10" fill="#f4f0e8"/><text x="194" y="225" text-anchor="middle" fill="#3a4438" font-size="14" font-weight="700">Rooms + connections</text><text x="194" y="248" text-anchor="middle" fill="#687166" font-size="12">graph.json</text><path d="M297 232H356" stroke="#607462" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="372" y="198" width="205" height="68" rx="10" fill="#f4f0e8"/><text x="474" y="225" text-anchor="middle" fill="#3a4438" font-size="14" font-weight="700">Local names + phrases</text><text x="474" y="248" text-anchor="middle" fill="#687166" font-size="12">aliases.json</text><path d="M577 232H636" stroke="#607462" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="652" y="198" width="225" height="68" rx="10" fill="#e5eef0"/><text x="764" y="225" text-anchor="middle" fill="#254b59" font-size="14" font-weight="700">Embed + store</text><text x="764" y="248" text-anchor="middle" fill="#52666b" font-size="12">local Qdrant collections</text><path d="M877 232H936" stroke="#607462" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="952" y="198" width="365" height="68" rx="10" fill="#f0f1ec"/><text x="1134" y="225" text-anchor="middle" fill="#3a4438" font-size="14" font-weight="700">Download/cache models, verify map</text><text x="1134" y="248" text-anchor="middle" fill="#687166" font-size="12">first run may need internet; test airplane mode after setup</text>
  </g>
  <g font-family="Arial,sans-serif"><rect x="50" y="326" width="1340" height="176" rx="18" fill="#eff5ee" stroke="#c3d2c1" stroke-width="2"/><rect x="50" y="326" width="12" height="176" rx="6" fill="#527b8a"/><text x="88" y="366" fill="#345c67" font-size="13" font-weight="700" letter-spacing="2">02 / PATIENT QUERY · REPEATS FOR EVERY REQUEST</text>
    <rect x="92" y="394" width="194" height="68" rx="10" fill="#fff" stroke="#b8c8bb"/><text x="189" y="421" text-anchor="middle" fill="#193824" font-size="14" font-weight="700">Ask / speak</text><text x="189" y="444" text-anchor="middle" fill="#687166" font-size="12">multilingual input</text><path d="M286 428H340" stroke="#607462" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="356" y="394" width="194" height="68" rx="10" fill="#fff" stroke="#b8c8bb"/><text x="453" y="421" text-anchor="middle" fill="#193824" font-size="14" font-weight="700">Find destination</text><text x="453" y="444" text-anchor="middle" fill="#687166" font-size="12">Qdrant + E5</text><path d="M550 428H604" stroke="#607462" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="620" y="394" width="194" height="68" rx="10" fill="#fff" stroke="#c4a784"/><text x="717" y="421" text-anchor="middle" fill="#68492d" font-size="14" font-weight="700">Plan the path</text><text x="717" y="444" text-anchor="middle" fill="#687166" font-size="12">graph + BFS</text><path d="M814 428H868" stroke="#607462" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="884" y="394" width="194" height="68" rx="10" fill="#fff" stroke="#b8c8bb"/><text x="981" y="421" text-anchor="middle" fill="#193824" font-size="14" font-weight="700">Explain + display</text><text x="981" y="444" text-anchor="middle" fill="#687166" font-size="12">LLM or fallback</text><path d="M1078 428H1132" stroke="#607462" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="1148" y="394" width="194" height="68" rx="10" fill="#193824"/><text x="1245" y="421" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Patient follows route</text><text x="1245" y="444" text-anchor="middle" fill="#d9e9db" font-size="12">turn-by-turn guidance</text>
  </g>
  <g font-family="Arial,sans-serif"><rect x="50" y="522" width="1340" height="176" rx="18" fill="#f2edf0" stroke="#d8cbd2" stroke-width="2"/><rect x="50" y="522" width="12" height="176" rx="6" fill="#9a6c73"/><text x="88" y="562" fill="#76505a" font-size="13" font-weight="700" letter-spacing="2">03 / OPERATIONS · WHEN A ROOM OR SERVICE CHANGES</text>
    <rect x="92" y="590" width="236" height="68" rx="10" fill="#fff" stroke="#d4c2c8"/><text x="210" y="617" text-anchor="middle" fill="#47333a" font-size="14" font-weight="700">Staff updates availability</text><text x="210" y="640" text-anchor="middle" fill="#776b70" font-size="12">admin action</text><path d="M328 624H411" stroke="#76616a" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="427" y="590" width="236" height="68" rx="10" fill="#fff" stroke="#d4c2c8"/><text x="545" y="617" text-anchor="middle" fill="#47333a" font-size="14" font-weight="700">Update location metadata</text><text x="545" y="640" text-anchor="middle" fill="#776b70" font-size="12">graph + Qdrant payload</text><path d="M663 624H746" stroke="#76616a" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="762" y="590" width="236" height="68" rx="10" fill="#fff" stroke="#d4c2c8"/><text x="880" y="617" text-anchor="middle" fill="#47333a" font-size="14" font-weight="700">Broadcast change</text><text x="880" y="640" text-anchor="middle" fill="#776b70" font-size="12">WebSocket event</text><path d="M998 624H1081" stroke="#76616a" stroke-width="2.5" marker-end="url(#arr)"/>
    <rect x="1097" y="590" width="236" height="68" rx="10" fill="#fff" stroke="#d4c2c8"/><text x="1215" y="617" text-anchor="middle" fill="#47333a" font-size="14" font-weight="700">Connected screens refresh</text><text x="1215" y="640" text-anchor="middle" fill="#776b70" font-size="12">verify persistence + reconnect</text>
  </g>
  <text x="58" y="735" fill="#687166" font-family="Arial,sans-serif" font-size="13">Offline claim: distinguish “no cloud at request time” from “zero internet needed ever.” Model download, updates, and multi-site sync need separate proof.</text>
</svg>
