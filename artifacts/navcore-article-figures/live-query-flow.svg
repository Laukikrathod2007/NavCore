<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">NavCore live query flow</title><desc id="desc">Detailed runtime flow for typed or recorded speech, local transcription, language and intent handling, Qdrant retrieval, clarification when needed, deterministic BFS route planning, and directions generated from that fixed route.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#59735e"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9a6845"/></marker></defs><rect width="1440" height="920" fill="#faf9f5"/>
  <text x="64" y="65" fill="#193824" font-family="Georgia,serif" font-size="32" font-weight="700">One request, from words to a walkable route</text><text x="64" y="99" fill="#627066" font-family="Arial,sans-serif" font-size="16">Current behavior: uncertain matches auto-select the top result; interactive clarification is a next step.</text>
  <g font-family="Arial,sans-serif" font-size="15" text-anchor="middle">
    <rect x="94" y="158" width="250" height="80" rx="13" fill="#fff" stroke="#9eb49f" stroke-width="2"/><text x="219" y="191" fill="#193824" font-weight="700">1 · Receive request</text><text x="219" y="216" fill="#59695d" font-size="13">typed text or recorded audio</text>
    <rect x="430" y="158" width="250" height="80" rx="13" fill="#e9f0e6" stroke="#9eb49f" stroke-width="2"/><text x="555" y="191" fill="#193824" font-weight="700">2 · Normalize input</text><text x="555" y="216" fill="#59695d" font-size="13">audio → local Whisper text</text>
    <rect x="766" y="158" width="250" height="80" rx="13" fill="#fff" stroke="#9eb49f" stroke-width="2"/><text x="891" y="191" fill="#193824" font-weight="700">3 · Understand request</text><text x="891" y="216" fill="#59695d" font-size="13">language · intent · entities</text>
    <rect x="1102" y="158" width="250" height="80" rx="13" fill="#e2edf0" stroke="#8baab2" stroke-width="2"/><text x="1227" y="191" fill="#254b59" font-weight="700">4 · Search meaning</text><text x="1227" y="216" fill="#52666b" font-size="13">embedding → Qdrant candidates</text>
  </g>
  <path d="M344 198H416M680 198H752M1016 198H1088" fill="none" stroke="#59735e" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1227 238V307" fill="none" stroke="#59735e" stroke-width="3" marker-end="url(#a)"/>
  <polygon points="1227,315 1350,385 1227,455 1104,385" fill="#fff4e5" stroke="#c39568" stroke-width="2.5"/><text x="1227" y="380" fill="#654729" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Confident, unique</text><text x="1227" y="404" fill="#654729" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">destination?</text>
  <path d="M1104 385H938V488" fill="none" stroke="#9a6845" stroke-width="2.5" marker-end="url(#b)"/><text x="1014" y="373" fill="#845b3b" font-family="Arial,sans-serif" font-size="13">No match / ambiguous</text>
  <path d="M1227 455V515" fill="none" stroke="#59735e" stroke-width="2.5" marker-end="url(#a)"/><text x="1250" y="490" fill="#59735e" font-family="Arial,sans-serif" font-size="13">Yes</text>
  <rect x="810" y="488" width="256" height="76" rx="13" fill="#e2edf0" stroke="#8baab2" stroke-width="2"/><text x="938" y="521" fill="#254b59" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">Current: auto-select top match</text><text x="938" y="545" fill="#52666b" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">Options/question available; no patient pause</text>
  <path d="M938 564V608H666V665" fill="none" stroke="#527b8a" stroke-width="2.5" marker-end="url(#a)"/><text x="796" y="602" fill="#527b8a" font-family="Arial,sans-serif" font-size="13">future: patient chooses</text>
  <rect x="1096" y="525" width="264" height="83" rx="13" fill="#f3eadf" stroke="#c39568" stroke-width="2"/><text x="1228" y="558" fill="#654729" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle">5 · Plan on the map graph</text><text x="1228" y="584" fill="#705a47" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">NetworkX BFS · fixed start → destination</text>
  <path d="M1228 608V679" fill="none" stroke="#9a6845" stroke-width="3" marker-end="url(#b)"/>
  <rect x="1096" y="686" width="264" height="86" rx="13" fill="#193824"/><text x="1228" y="719" fill="#fff" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">6 · Explain the computed path</text><text x="1228" y="746" fill="#d8e8da" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">local LLM or template fallback</text>
  <path d="M1096 729H986" fill="none" stroke="#59735e" stroke-width="3" marker-end="url(#a)"/>
  <rect x="695" y="686" width="282" height="86" rx="13" fill="#fff" stroke="#9eb49f" stroke-width="2"/><text x="836" y="719" fill="#193824" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">7 · Return guidance</text><text x="836" y="746" fill="#59695d" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">destination · steps · warnings</text>
  <rect x="82" y="662" width="490" height="122" rx="14" fill="#f0f1ec" stroke="#d4d7ce"/><text x="110" y="699" fill="#46634b" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SAFETY BOUNDARY</text><text x="110" y="731" fill="#34483a" font-family="Arial,sans-serif" font-size="15">The language model receives a path already computed</text><text x="110" y="755" fill="#34483a" font-family="Arial,sans-serif" font-size="15">from the hospital graph; it formats instructions but</text><text x="110" y="779" fill="#193824" font-family="Arial,sans-serif" font-size="15" font-weight="700">does not invent turns or select corridors.</text>
  <path d="M695 729H600V575H810" fill="none" stroke="#59735e" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="611" y="712" fill="#657269" font-family="Arial,sans-serif" font-size="12" transform="rotate(-90 611 712)">planned clarification loop</text>
  <text x="82" y="853" fill="#66736a" font-family="Arial,sans-serif" font-size="13">Build note: the backend exposes this pipeline. Before publication, verify each user-facing input path is wired to the same API flow.</text>
</svg>
