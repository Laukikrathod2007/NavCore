<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">NavCore system map</title><desc id="desc">Offline hospital navigation: speech or typed queries pass through language and intent handling, semantic retrieval in Qdrant, a deterministic NetworkX route, then language generation for directions. Hospital graph and aliases are prepared during ingestion.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#55705b"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#527b8a"/></marker></defs>
  <rect width="1440" height="760" fill="#f8f7f2"/>
  <text x="60" y="62" fill="#193824" font-family="Georgia,serif" font-size="30" font-weight="700">NavCore: two memories, one verified route</text>
  <text x="60" y="94" fill="#617066" font-family="Arial,sans-serif" font-size="16">Semantic memory finds the place people mean. Topological memory computes how to reach it.</text>
  <rect x="42" y="132" width="1356" height="426" rx="20" fill="#eff5ee" stroke="#bdcdbd" stroke-width="2"/>
  <text x="68" y="168" fill="#47654d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">LOCAL NAVCORE RUNTIME · HOSPITAL DEVICE</text>
  <g font-family="Arial,sans-serif">
    <rect x="78" y="226" width="190" height="114" rx="14" fill="#fff" stroke="#8eaa91" stroke-width="2"/><text x="173" y="264" text-anchor="middle" fill="#193824" font-size="17" font-weight="700">Patient request</text><text x="173" y="291" text-anchor="middle" fill="#536559" font-size="14">typed or spoken</text><text x="173" y="316" text-anchor="middle" fill="#536559" font-size="13">Hindi · Marathi · English</text>
    <rect x="326" y="226" width="196" height="114" rx="14" fill="#fff" stroke="#8eaa91" stroke-width="2"/><text x="424" y="264" text-anchor="middle" fill="#193824" font-size="17" font-weight="700">Understand</text><text x="424" y="291" text-anchor="middle" fill="#536559" font-size="14">ASR for audio</text><text x="424" y="316" text-anchor="middle" fill="#536559" font-size="13">language + intent</text>
    <rect x="584" y="204" width="248" height="158" rx="14" fill="#fff" stroke="#527b8a" stroke-width="2.5"/><text x="708" y="241" text-anchor="middle" fill="#254b59" font-size="18" font-weight="700">Semantic memory</text><text x="708" y="270" text-anchor="middle" fill="#536559" font-size="14">multilingual-e5-small</text><text x="708" y="294" text-anchor="middle" fill="#536559" font-size="14">Qdrant local collections</text><text x="708" y="328" text-anchor="middle" fill="#527b8a" font-size="12">colloquial phrase → candidate room</text>
    <rect x="914" y="204" width="238" height="158" rx="14" fill="#fff" stroke="#bc8453" stroke-width="2.5"/><text x="1033" y="241" text-anchor="middle" fill="#754827" font-size="18" font-weight="700">Topological memory</text><text x="1033" y="270" text-anchor="middle" fill="#536559" font-size="14">NetworkX hospital graph</text><text x="1033" y="294" text-anchor="middle" fill="#536559" font-size="14">BFS shortest path</text><text x="1033" y="328" text-anchor="middle" fill="#9b6740" font-size="12">entrance → lift → corridor → room</text>
    <rect x="1230" y="226" width="132" height="114" rx="14" fill="#193824"/><text x="1296" y="267" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Directions</text><text x="1296" y="294" text-anchor="middle" fill="#d9e9db" font-size="13">route + voice</text><text x="1296" y="317" text-anchor="middle" fill="#d9e9db" font-size="12">optional local LLM</text>
    <path d="M268 283H313" stroke="#55705b" stroke-width="3" marker-end="url(#arrow)"/><path d="M522 283H570" stroke="#55705b" stroke-width="3" marker-end="url(#arrow)"/><path d="M832 283H900" stroke="#55705b" stroke-width="3" marker-end="url(#arrow)"/><path d="M1152 283H1217" stroke="#55705b" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="865" y="253" text-anchor="middle" fill="#637066" font-size="11">resolved node</text>
    <rect x="660" y="420" width="468" height="78" rx="12" fill="#e2edf0" stroke="#a6c0c7" stroke-width="1.5"/><text x="894" y="450" text-anchor="middle" fill="#254b59" font-size="15" font-weight="700">Ambiguity: current behavior</text><text x="894" y="475" text-anchor="middle" fill="#52666b" font-size="13">Currently auto-selects top candidate; patient choice is future work.</text>
    <path d="M708 362V399" stroke="#527b8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#blueArrow)"/><path d="M894 420V382" stroke="#527b8a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#blueArrow)"/>
    <text x="80" y="393" fill="#47654d" font-size="13" font-weight="700">DESIGN GUARANTEE</text><text x="80" y="419" fill="#34483a" font-size="15">The language model may phrase the route.</text><text x="80" y="443" fill="#34483a" font-size="15" font-weight="700">It does not choose the route.</text>
  </g>
  <rect x="42" y="592" width="1356" height="122" rx="18" fill="#fff" stroke="#d5d5ca" stroke-width="2"/>
  <text x="68" y="628" fill="#47654d" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">PREPARE ONCE · REFRESH WHEN THE HOSPITAL MAP CHANGES</text>
  <g font-family="Arial,sans-serif"><rect x="80" y="651" width="250" height="42" rx="8" fill="#f3f2eb"/><text x="205" y="678" text-anchor="middle" fill="#37463a" font-size="14">graph.json · rooms and links</text><path d="M330 672H450" stroke="#55705b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="466" y="651" width="235" height="42" rx="8" fill="#f3f2eb"/><text x="583" y="678" text-anchor="middle" fill="#37463a" font-size="14">aliases.json · local phrases</text><path d="M701 672H820" stroke="#55705b" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="836" y="651" width="250" height="42" rx="8" fill="#e2edf0"/><text x="961" y="678" text-anchor="middle" fill="#254b59" font-size="14">embeddings → local Qdrant</text><text x="1123" y="677" fill="#617066" font-size="13">No CLIP images in current build</text></g>
</svg>
