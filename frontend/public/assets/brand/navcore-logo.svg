<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1410" />
      <stop offset="100%" stop-color="#2d5016" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c8a5c" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer rounded container -->
  <rect width="40" height="40" rx="10" fill="url(#navGrad)" />
  <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="#ffffff" stroke-opacity="0.12" />
  
  <!-- Dual Memory Rings (Semantic + Topological) -->
  <circle cx="20" cy="20" r="12" stroke="#5c8a5c" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="20" cy="20" r="7" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
  
  <!-- Spatial Graph Nodes & Vector Links -->
  <path d="M14 24 L20 12 L26 24 L20 20 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  <circle cx="20" cy="12" r="2.5" fill="#ffffff" />
  <circle cx="14" cy="24" r="2" fill="#5c8a5c" />
  <circle cx="26" cy="24" r="2" fill="#5c8a5c" />
  <circle cx="20" cy="20" r="1.5" fill="#ffffff" />
</svg>