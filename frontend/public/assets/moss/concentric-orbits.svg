<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Outer Dotted Orbit -->
  <circle cx="80" cy="80" r="62" stroke="#555555" stroke-width="1.2" stroke-dasharray="4 4" />
  
  <!-- Middle Dotted Orbit -->
  <circle cx="80" cy="80" r="44" stroke="#888888" stroke-width="1.2" stroke-dasharray="3 3" />
  
  <!-- Inner Orbit -->
  <circle cx="80" cy="80" r="28" stroke="#5c8a5c" stroke-width="1.2" />

  <!-- Soft Central Halo -->
  <circle cx="80" cy="80" r="20" fill="#fef0c7" fill-opacity="0.75" />

  <!-- Satellite Node on Outer Orbit -->
  <circle cx="70" cy="142" r="4.5" fill="#0f1410" />
</svg>