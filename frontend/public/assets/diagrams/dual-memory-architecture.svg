<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="360" fill="none">
  <defs>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbfbfa"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f7f2"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background grid lines -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e5e5e0" stroke-width="0.75" stroke-opacity="0.6"/>
  </pattern>
  <rect width="800" height="360" fill="url(#grid)" rx="16"/>

  <!-- Left: Input Query -->
  <g transform="translate(30, 110)">
    <rect width="180" height="140" rx="14" fill="#ffffff" stroke="#e5e5e0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="16" width="32" height="32" rx="8" fill="#f0f7f2"/>
    <text x="23" y="38" font-size="16">🎙️</text>
    <text x="56" y="32" font-family="sans-serif" font-weight="700" font-size="14" fill="#0f1410">Patient Query</text>
    <text x="56" y="47" font-family="sans-serif" font-size="11" fill="#737373">Hindi / Mar / Eng / Mix</text>
    <rect x="14" y="62" width="152" height="60" rx="8" fill="#fafafa" stroke="#e5e5e0"/>
    <text x="24" y="85" font-family="sans-serif" font-size="12" font-style="italic" fill="#0f1410">"dil ke doctor"</text>
    <text x="24" y="105" font-family="monospace" font-size="10" fill="#5c8a5c">384-dim embed</text>
  </g>

  <!-- Connectors to Memories -->
  <path d="M210 160 C 240 160, 240 70, 280 70" stroke="#5c8a5c" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <path d="M210 200 C 240 200, 240 280, 280 280" stroke="#0f1410" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- Top Center: Semantic Memory -->
  <g transform="translate(280, 20)">
    <rect width="240" height="110" rx="14" fill="url(#cardGrad2)" stroke="#abe6c7" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#2d5016"/>
    <text x="21" y="35" font-size="14" fill="#fff">🧠</text>
    <text x="54" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#0f1410">SEMANTIC MEMORY</text>
    <text x="54" y="42" font-family="sans-serif" font-size="11" fill="#2d5016" font-weight="600">Qdrant Edge (Vector Space)</text>
    <text x="14" y="70" font-family="sans-serif" font-size="11" fill="#525252">• 104 multilingual alias vectors</text>
    <text x="14" y="88" font-family="sans-serif" font-size="11" fill="#525252">• Sub-10ms Cosine &lt;0.82 threshold</text>
    <rect x="150" y="86" width="76" height="18" rx="4" fill="#dbf0e0"/>
    <text x="156" y="99" font-family="monospace" font-size="9" font-weight="700" fill="#2d5016">cardiology_opd</text>
  </g>

  <!-- Bottom Center: Topological Memory -->
  <g transform="translate(280, 220)">
    <rect width="240" height="110" rx="14" fill="#ffffff" stroke="#e5e5e0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="14" y="14" width="30" height="30" rx="8" fill="#0f1410"/>
    <text x="21" y="35" font-size="14" fill="#fff">🗺️</text>
    <text x="54" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#0f1410">TOPOLOGICAL MEMORY</text>
    <text x="54" y="42" font-family="sans-serif" font-size="11" fill="#737373" font-weight="600">NetworkX (Deterministic BFS)</text>
    <text x="14" y="70" font-family="sans-serif" font-size="11" fill="#525252">• 20 hospital nodes, 4 floors</text>
    <text x="14" y="88" font-family="sans-serif" font-size="11" fill="#525252">• 0% junction hallucination</text>
    <rect x="145" y="86" width="82" height="18" rx="4" fill="#f4f4f3"/>
    <text x="151" y="99" font-family="monospace" font-size="9" font-weight="700" fill="#0f1410">entrance→lift→F3</text>
  </g>

  <!-- Connectors to Direction Generator -->
  <path d="M520 70 C 560 70, 560 160, 590 160" stroke="#5c8a5c" stroke-width="2" fill="none"/>
  <path d="M520 280 C 560 280, 560 200, 590 200" stroke="#0f1410" stroke-width="2" fill="none"/>

  <!-- Right: Edge Direction Generator -->
  <g transform="translate(590, 95)">
    <rect width="180" height="170" rx="14" fill="#ffffff" stroke="#5c8a5c" stroke-width="2" filter="url(#shadow)"/>
    <rect x="14" y="14" width="32" height="32" rx="8" fill="#f0f7f2"/>
    <text x="23" y="37" font-size="16">⚡</text>
    <text x="54" y="28" font-family="sans-serif" font-weight="700" font-size="13" fill="#0f1410">Natural Directions</text>
    <text x="54" y="42" font-family="sans-serif" font-size="11" fill="#5c8a5c" font-weight="600">Llama 3.2 3B (Edge)</text>
    <rect x="14" y="60" width="152" height="95" rx="8" fill="#fafafa" stroke="#e5e5e0"/>
    <text x="22" y="80" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f1410">Hindi / English Output:</text>
    <text x="22" y="98" font-family="sans-serif" font-size="10" fill="#525252">"सीधे जाएं, लिफ्ट A से</text>
    <text x="22" y="114" font-family="sans-serif" font-size="10" fill="#525252">तीसरी मंजिल, कमरा 312"</text>
    <text x="22" y="140" font-family="monospace" font-size="9" font-weight="700" fill="#2d5016">⚡ 340ms Total Latency</text>
  </g>
</svg>